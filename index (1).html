<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kavelyr — Discover who you can become</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#F3F5F1;--card:#fff;--ink:#0F2A24;--mut:#4A5F59;--line:#DCE4DE;--acc:#1F7A63;--on:#fff;--warm:#FBF1DA;--wink:#4A3A12;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1C19;--card:#152825;--ink:#EAF0EC;--mut:#A9BDB5;--line:#27403A;--acc:#4CC3A2;--on:#06231C;--warm:#3A2F14;--wink:#F2DDA6}}
:root[data-theme="dark"]{--bg:#0E1C19;--card:#152825;--ink:#EAF0EC;--mut:#A9BDB5;--line:#27403A;--acc:#4CC3A2;--on:#06231C;--warm:#3A2F14;--wink:#F2DDA6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 'DM Sans',system-ui,sans-serif;min-height:100vh}
h1,h2{font-family:'Fraunces',Georgia,serif;font-weight:500;line-height:1.15;margin:0 0 12px;letter-spacing:-.01em}
h1{font-size:clamp(30px,6vw,42px)}h2{font-size:26px}
.w{max-width:760px;margin:0 auto;padding:20px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.btn{background:var(--acc);color:var(--on);border:1.5px solid var(--acc);border-radius:999px;padding:12px 22px;font:700 16px 'DM Sans',sans-serif;min-height:46px;cursor:pointer}
.btn.g{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.chip{background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;font:500 15px 'DM Sans',sans-serif;min-height:44px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--on);border-color:var(--acc)}
input[type=text],input[type=email],input[type=password],textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:400 16px 'DM Sans',sans-serif;min-height:46px}
label{font-weight:700;display:block;margin:12px 0 6px}
.mut{color:var(--mut);font-size:14px;margin:6px 0}
.tag{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.tabs{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:10px 20px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.brand{font-family:'Fraunces',Georgia,serif;font-size:20px;margin-right:10px}
.tab{background:transparent;color:var(--ink);border:0;border-radius:999px;padding:10px 16px;font:700 15px 'DM Sans',sans-serif;min-height:44px;cursor:pointer;white-space:nowrap}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.warm{background:var(--warm);color:var(--wink);border-radius:12px;padding:12px 14px;margin:10px 0}
.task{display:flex;gap:12px;align-items:center;min-height:44px;font-weight:400;margin:4px 0}
.task input{width:22px;height:22px;flex:none}
.quote{border-left:3px solid var(--line);padding-left:12px;color:var(--mut);margin:8px 0}
</style></head>
<body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mem={};
const st={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]==null?null:mem[k]}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}};
const users=()=>{try{return JSON.parse(st.get('kv_u')||'{}')}catch(e){return{}}};
const rnd=()=>[...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hash(p,s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const fresh=()=>({ob:{goals:[]},a:{},done:{},ostep:0,astep:0,plans:[],cur:'',journal:[],dis:[]});
const cp=()=>D.plans.find(p=>p.id===D.cur)||null;
const mig=()=>{if(!D.plans){D.plans=D.chosen?[{id:rnd(),n:D.chosen,plan:D.plan||[]}]:[];D.cur=D.plans[0]?D.plans[0].id:''}};
let me=null,D=null,V={tab:'profile',f:null,edit:false,mode:'signup',err:'',exp:false,cd:false};
const save=()=>{if(!me)return;const u=users();if(u[me]){u[me].d=D;st.set('kv_u',JSON.stringify(u))}};

const INT=['Technology','Writing','Design','Teaching','Health','Business','Science','Arts','Community','Finance','Law','Nature'];
const STR=['Explaining ideas','Organising','Solving problems','Creating','Leading','Listening','Researching','Persuading'];
const VAL=['Creativity','Stability','Independence','Service','Learning','Achievement','Connection','Flexibility'];
const OB=[
{k:'reason',q:'What brought you to Kavelyr?',t:'text'},
{k:'goals',q:'Which areas would you like to explore?',t:'multi',o:['Interests and strengths','Values and priorities','Careers and education','Confidence in decisions','Personal habits','Finding direction','Setting goals']},
{k:'situation',q:'What is your current situation?',t:'one',o:['Student','Early in my career','Changing direction','Feeling stuck','Something else']},
{k:'time',q:'How long would you like your first session to be?',t:'one',o:['About 10 minutes','About 20 minutes','As long as it takes']}];
const AS=[
{s:'Interests',k:'interests',q:'Which topics or activities do you enjoy learning about or working on?',t:'multi',o:INT},
{s:'Strengths',k:'good',q:'What do you think you are good at?',t:'multi',o:STR},
{s:'Strengths',k:'shown',q:'Which of these have you actually shown in real situations? Tick only ones you can point to an example of.',t:'multi',o:STR},
{s:'Values',k:'values',q:'What matters most to you in work and life?',t:'multi',o:VAL,max:3},
{s:'Preferences',k:'learn',q:'How do you learn best?',t:'one',o:['By doing','By reading','By discussing','By watching']},
{s:'Preferences',k:'collab',q:'How do you like to work?',t:'one',o:['Mostly alone','In a small team','A mix of both']},
{s:'Experiences',k:'proud',q:'Describe something you are proud of, and what you did.',t:'text'},
{s:'Aspirations',k:'aspire',q:'What do you want to learn, contribute, or change?',t:'text'},
{s:'Circumstances',k:'time',q:'How much time a week could you put into exploring? (optional)',t:'one',o:['1–2 hours','3–5 hours','6+ hours']}];
const C=[
{n:'Product & UX design',t:['Design','Technology','Creating','Solving problems','Creativity'],x:'Redesign one screen of an app you use and explain your choices'},
{n:'Software development',t:['Technology','Solving problems','Learning','Independence'],x:'Build a tiny project, such as a to-do list, with a free beginner tutorial'},
{n:'Teaching & education',t:['Teaching','Explaining ideas','Service','Connection','Listening'],x:'Teach a topic you know to two people and ask what was unclear'},
{n:'Data & research',t:['Science','Researching','Learning','Solving problems','Technology'],x:'Pick a question you are curious about and find three credible sources on it'},
{n:'Content & communications',t:['Writing','Persuading','Explaining ideas','Creativity','Arts'],x:'Write a 300-word piece on a topic you know and share it with three people'},
{n:'Community & programme work',t:['Community','Organising','Leading','Connection','Service'],x:'Organise one small meetup or study group and note what you enjoyed'},
{n:'Business & entrepreneurship',t:['Business','Leading','Persuading','Independence','Achievement'],x:'Sketch a one-page service idea and test it with two potential users'},
{n:'Health & wellbeing support',t:['Health','Listening','Service','Connection'],x:'Volunteer or shadow for a few hours in a health or support setting'},
{n:'Law & policy',t:['Law','Researching','Persuading','Writing','Service'],x:'Read one short case or policy brief and summarise it in your own words'},
{n:'Finance & analysis',t:['Finance','Organising','Solving problems','Stability','Business'],x:'Build a simple budget or analysis of a real example in a spreadsheet'},
{n:'Environment & outdoors',t:['Nature','Science','Service','Independence'],x:'Join or observe one local environmental activity and note what stood out'}];

function rank(){const a=D.a,I=a.interests||[],G=a.good||[],S=a.shown||[],M=a.values||[];
return C.map(c=>{let s=0;const m=[];c.t.forEach(t=>{const w=(I.includes(t)?1:0)+(S.includes(t)?2:0)+(G.includes(t)&&!S.includes(t)?1:0)+(M.includes(t)?1:0);if(w){s+=w;m.push(t)}});return Object.assign({},c,{s,m})}).filter(c=>c.s>0).sort((x,y)=>y.s-x.s).slice(0,4)}

function auth(){const s=V.mode==='signup';
return `<main class="w" style="padding-top:48px"><h1>Kavelyr</h1><p class="mut" style="font-size:18px">Discover who you can become.</p>
<form class="card" id="af"><h2>${s?'Create your account':'Welcome back'}</h2>
<label for="em">Email</label><input id="em" type="email" autocomplete="email" required>
<label for="pw">Password</label><input id="pw" type="password" autocomplete="${s?'new-password':'current-password'}" required>
${V.err?`<p class="warm" role="alert">${E(V.err)}</p>`:''}
<div class="row" style="margin-top:16px"><button class="btn">${s?'Create account':'Log in'}</button><button type="button" class="btn g" data-a="mode">${s?'I have an account':'Create an account'}</button></div>
<p class="mut">Passwords are salted and hashed, never stored as plain text. In this prototype your data stays in this browser only, so email verification and recovery need a server.</p></form></main>`}

function flow(){const f=V.f,L=f==='ob'?OB:AS,k=f==='ob'?'ostep':'astep',i=D[k],d=L[i],s=f==='ob'?D.ob:D.a,v=s[d.k];
const body=d.t==='text'?`<textarea data-key="${d.k}" rows="5" aria-label="${E(d.q)}">${E(v||'')}</textarea>`:`<div class="chips">${d.o.map(o=>{const on=d.t==='multi'?(v||[]).includes(o):v===o;return `<button type="button" class="chip" aria-pressed="${on}" data-a="opt" data-v="${E(o)}">${E(o)}</button>`}).join('')}</div>`;
return `<main class="w"><span class="tag">${f==='ob'?'Getting started':E(d.s)} · ${i+1} of ${L.length}</span>
<div class="bar" role="progressbar" aria-valuemin="1" aria-valuemax="${L.length}" aria-valuenow="${i+1}"><i style="width:${(i+1)/L.length*100}%"></i></div>
<h2 style="margin-top:24px">${E(d.q)}</h2>${d.max?`<p class="mut">Choose up to ${d.max}.</p>`:''}
<p class="mut">${f==='ob'?'Your answers shape suggestions. They are not definitive judgments.':'Skip anything that does not apply. Progress saves automatically.'}</p>${body}
<div class="row" style="margin-top:24px"><button class="btn g" data-a="back" ${i?'':'disabled'}>Back</button><button class="btn" data-a="next">${i===L.length-1?'Finish':'Next'}</button><button class="btn g" data-a="next">Skip</button>${V.edit?'<button class="btn g" data-a="exit">Cancel</button>':''}</div></main>`}

const T=[['profile','Profile'],['explore','Explore'],['plan','Plan'],['journal','Journal'],['settings','Settings']];
function home(){return `<nav class="tabs" aria-label="Sections"><span class="brand">Kavelyr</span>${T.map(x=>`<button class="tab" ${V.tab===x[0]?'aria-current="page"':''} data-a="tab" data-v="${x[0]}">${x[1]}</button>`).join('')}</nav><main class="w">${views[V.tab]()}</main>`}
const sec=(t,h)=>`<div class="card"><span class="tag">${t}</span>${h}</div>`;
const chips=l=>l.length?`<div class="chips">${l.map(i=>`<button class="chip" data-a="dis" data-v="${E(i)}" aria-label="Remove ${E(i)} from my profile">${E(i)} ×</button>`).join('')}</div>`:'<p class="mut">Nothing added yet.</p>';
const views={
profile(){const a=D.a,vis=l=>(l||[]).filter(x=>D.dis.indexOf(x)<0),S=vis(a.shown),P=vis((a.good||[]).filter(x=>!(a.shown||[]).includes(x))),
n=(a.interests||[]).length+(a.good||[]).length+(a.values||[]).length,R=rank(),pr=[a.learn,a.collab,a.time&&a.time+' a week'].filter(Boolean),
nx=(cp()?cp().plan:[]).find(p=>!p.done);
return `<h1>My profile</h1><p class="mut">A snapshot of what you told us, plus suggestions. Tap × on anything that does not fit.</p>
${n<4?'<p class="warm">This is based on limited information. Add more answers for a fuller picture.</p>':''}
${sec('My interests · you said',chips(vis(a.interests)))}
${sec('My strengths',`<p class="mut">Shown in real situations · you said</p>${chips(S)}<p class="mut">Possible strengths, not yet shown · you said</p>${chips(P)}<p class="mut">Why: a strength counts as demonstrated only when you pointed to real examples. The rest are possibilities to test.</p>`)}
${sec('My values · you said',chips(vis(a.values)))}
${sec('My preferences · you said',pr.length?`<div class="chips">${pr.map(x=>`<span class="chip" style="cursor:default">${E(x)}</span>`).join('')}</div>`:'<p class="mut">Nothing added yet.</p>')}
${a.proud||a.aspire?sec('My experiences and aspirations · you said',(a.proud?`<p class="quote">${E(a.proud)}</p>`:'')+(a.aspire?`<p class="quote">${E(a.aspire)}</p>`:'')):''}
${sec('My opportunities · suggested by Kavelyr',R.length?R.slice(0,3).map(c=>`<p><strong>${E(c.n)}</strong><br><span class="mut">Why it may fit: ${E(c.m.join(', '))}</span></p>`).join('')+'<button class="btn g" data-a="tab" data-v="explore">Explore these</button>':'<p class="mut">Add interests or strengths in your assessment to see suggestions.</p>')}
${sec('My next steps · suggested',nx?`<p>${E(nx.t)}</p><button class="btn g" data-a="tab" data-v="plan">Open my plan</button>`:'<p>Choose a direction in Explore to get a small action plan.</p>')}
${D.dis.length?'<button class="btn g" data-a="undis">Restore removed items ('+D.dis.length+')</button>':''}`},
explore(){const R=rank();return `<h1>Explore</h1><p class="mut">Suggestions to investigate, not verdicts. You can disagree and explore anything else.</p>`+(R.length?R.map(c=>`<div class="card"><h2 style="font-size:22px">${E(c.n)}</h2><p>Why it may fit: it matches ${E(c.m.join(', '))}.</p><p class="mut">First experiment: ${E(c.x)}.</p>${D.plans.some(p=>p.n===c.n)?`<button class="btn g" data-a="pick" data-v="${E(c.n)}">Open my plan</button>`:`<button class="btn" data-a="pick" data-v="${E(c.n)}">Work on this</button>`}</div>`).join(''):'<div class="card"><p>Finish your assessment to see areas worth exploring.</p><button class="btn" data-a="edit" data-v="as">Go to assessment</button></div>')+'<div class="card"><span class="tag">Add your own skill</span><label for="sk">A skill or direction you want to learn</label><div class="row"><input id="sk" type="text" style="flex:1;min-width:180px" placeholder="e.g. Public speaking"><button class="btn" data-a="addskill">Start plan</button></div></div>'},
plan(){const c=cp();if(!c)return '<h1>My plans</h1><div class="card"><p>Pick a direction in Explore, or add your own skill, and Kavelyr will create a small two-week plan.</p><button class="btn" data-a="tab" data-v="explore">Explore directions</button></div>';
const P=c.plan,d=P.filter(p=>p.done).length,t=P.length;
return `<h1>My plans</h1><div class="chips" role="group" aria-label="My skills">${D.plans.map(p=>`<button class="chip" aria-pressed="${p.id===D.cur}" data-a="sw" data-v="${p.id}">${E(p.n)}</button>`).join('')}<button class="chip" data-a="tab" data-v="explore">+ Add another skill</button></div>
<div class="card"><span class="tag">Two-week exploration · ${E(c.n)}</span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${t}" aria-valuenow="${d}"><i style="width:${t?d/t*100:0}%"></i></div><p class="mut">${d} of ${t} actions done</p>
${P.map((p,i)=>`<label class="task"><input type="checkbox" data-a="tog" data-v="${i}" ${p.done?'checked':''}>${E(p.t)}</label>`).join('')}
<label for="newt">Add your own action</label><div class="row"><input id="newt" type="text" style="flex:1;min-width:180px"><button class="btn g" data-a="addt">Add</button></div>
<div class="row" style="margin-top:16px">${V.rm===c.id?'<button class="btn" data-a="rmgo">Yes, remove this skill</button><button class="btn g" data-a="rmno">Keep it</button>':'<button class="btn g" data-a="rm1">Remove this skill</button>'}</div></div>
${d===t&&t?'<div class="warm">Nice work. Write what you learned in your Journal, then adjust or add another skill.</div><div class="row"><button class="btn" data-a="tab" data-v="journal">Write a reflection</button><button class="btn g" data-a="tab" data-v="explore">Add another skill</button></div>':''}`},
journal(){return `<h1>Journal</h1><div class="card"><label for="j">What did you notice, try, or learn?</label><textarea id="j" rows="4"></textarea><div style="margin-top:12px"><button class="btn" data-a="savej">Save reflection</button></div></div>`+(D.journal.length?D.journal.map((e,i)=>`<div class="card"><span class="tag">${E(e.d)}</span><p style="white-space:pre-wrap;margin:0 0 10px">${E(e.t)}</p><button class="btn g" data-a="delj" data-v="${i}">Delete</button></div>`).join(''):'<p class="mut">No reflections yet.</p>')},
settings(){return `<h1>Settings and privacy</h1>
<div class="card"><span class="tag">Update my answers</span><p class="mut">Your answers can change anytime. Suggestions update with them.</p><div class="row"><button class="btn g" data-a="edit" data-v="ob">Edit getting-started answers</button><button class="btn g" data-a="edit" data-v="as">Edit assessment</button></div></div>
<div class="card"><span class="tag">My data</span><p class="mut">We store your answers, plan, and reflections only to personalise your experience. In this prototype they live in this browser.</p><button class="btn g" data-a="export">${V.exp?'Hide my data':'Show my data'}</button>${V.exp?`<textarea readonly rows="8" style="margin-top:12px" aria-label="My data">${E(JSON.stringify(D,null,1))}</textarea>`:''}</div>
<div class="card"><span class="tag">Account</span><div class="row"><button class="btn g" data-a="out">Log out</button>${V.cd?'<button class="btn" data-a="del2">Yes, permanently delete my account</button><button class="btn g" data-a="del0">Keep it</button>':'<button class="btn g" data-a="del1">Delete account</button>'}</div></div>`}};

function render(){$('#app').innerHTML=!me?auth():V.f?flow():home();window.scrollTo(0,0)}
function enter(em){me=em;st.set('kv_s',em);D=users()[em].d;mig();V={tab:'profile',f:!D.done.ob?'ob':!D.done.a_?(!D.done.as?'as':null):null,edit:false,mode:'login',err:'',exp:false,cd:false}}
function act(a,v){const f=V.f,L=f==='ob'?OB:AS,k=f==='ob'?'ostep':'astep';
switch(a){
case 'mode':V.mode=V.mode==='signup'?'login':'signup';V.err='';break;
case 'opt':{const d=L[D[k]],s=f==='ob'?D.ob:D.a;if(d.t==='multi'){const r=s[d.k]=s[d.k]||[],i=r.indexOf(v);if(i>-1)r.splice(i,1);else if(!d.max||r.length<d.max)r.push(v)}else s[d.k]=s[d.k]===v?'':v;break}
case 'back':D[k]--;break;
case 'next':if(D[k]<L.length-1)D[k]++;else{D.done[f]=true;D[k]=0;if(f==='ob'&&!D.done.as&&!V.edit)V.f='as';else{V.f=null;V.edit=false;V.tab='profile'}}break;
case 'exit':V.f=null;V.edit=false;break;
case 'tab':V.tab=v;V.exp=false;break;
case 'dis':D.dis.push(v);break;
case 'undis':D.dis=[];break;
case 'pick':{const c=C.find(x=>x.n===v);let p=D.plans.find(x=>x.n===c.n);if(!p){p={id:rnd(),n:c.n,plan:[{t:'Talk to someone working in '+c.n+' for 15 minutes (days 1–5)'},{t:c.x+' (days 3–10)'},{t:'Write down what energised you and what drained you (days 11–14)'}]};D.plans.push(p)}D.cur=p.id;V.tab='plan';break}
case 'addskill':{const x=$('#sk').value.trim();if(!x)break;let p=D.plans.find(q=>q.n.toLowerCase()===x.toLowerCase());if(!p){p={id:rnd(),n:x,plan:[{t:'Talk to someone who uses '+x+' for 15 minutes (days 1–5)'},{t:'Try one beginner exercise or tutorial in '+x+' (days 3–10)'},{t:'Write down what energised you and what drained you (days 11–14)'}]};D.plans.push(p)}D.cur=p.id;V.tab='plan';break}
case 'sw':D.cur=v;V.rm='';break;
case 'rm1':V.rm=D.cur;break;
case 'rmno':V.rm='';break;
case 'rmgo':D.plans=D.plans.filter(p=>p.id!==D.cur);D.cur=D.plans[0]?D.plans[0].id:'';V.rm='';break;
case 'tog':cp().plan[+v].done=!cp().plan[+v].done;break;
case 'addt':{const x=$('#newt').value.trim();if(x)cp().plan.push({t:x});break}
case 'savej':{const x=$('#j').value.trim();if(x)D.journal.unshift({d:new Date().toLocaleDateString(),t:x});break}
case 'delj':D.journal.splice(+v,1);break;
case 'edit':V.f=v;V.edit=true;D[v==='ob'?'ostep':'astep']=0;break;
case 'export':V.exp=!V.exp;break;
case 'del1':V.cd=true;break;
case 'del0':V.cd=false;break;
case 'out':me=null;D=null;st.del('kv_s');V.mode='login';break;
case 'del2':{const u=users();delete u[me];st.set('kv_u',JSON.stringify(u));st.del('kv_s');me=null;D=null;V.cd=false;V.mode='signup';break}}
save();render()}
