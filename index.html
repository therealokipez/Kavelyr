${D.cks.filter(x=>x.w!==wk()).slice(0,4).map(x=>`<div class="card"><span class="tag">Week of ${E(x.w)}</span><p class="mut">Energised: ${E(x.e||'—')}<br>Drained: ${E(x.d||'—')}<br>Progress: ${x.r||'—'}/5</p></div>`).join('')}`},
journal(){return `<h1>Journal</h1><div class="card"><label for="j">What did you notice, try, or learn?</label><textarea id="j" rows="4"></textarea><div style="margin-top:12px"><button class="btn" data-a="savej">Save reflection</button></div></div>`+(D.journal.length?D.journal.map((e,i)=>`<div class="card"><span class="tag">${E(e.d)}</span><p style="white-space:pre-wrap;margin:0 0 10px">${E(e.t)}</p><button class="btn g" data-a="delj" data-v="${i}">Delete</button></div>`).join(''):'<p class="mut">No reflections yet.</p>')},
settings(){const l=refLink();return `<h1>Settings and privacy</h1>${dip?'<div class="card"><span class="tag">Install</span><button class="btn" data-a="inst">Install Kavelyr</button></div>':''}
<div class="card"><span class="tag">Profile details</span><label for="gl">My goal</label><textarea id="gl" rows="2" data-ob="reason">${E(D.ob.reason||'')}</textarea><label for="ph">Profile photo</label><input id="ph" type="file" accept="image/*" data-av="1"><label for="dn">Display name</label><input id="dn" type="text" data-pf="display_name" value="${E(D.pd.display_name)}"><label for="co">Country</label><input id="co" type="text" data-pf="country" value="${E(D.pd.country)}"><label for="bi">About me (optional)</label><textarea id="bi" rows="3" data-pf="bio">${E(D.pd.bio)}</textarea><p class="mut">Saved automatically. Shown only to you.</p></div>
<div class="card"><span class="tag">Invite friends</span><p class="mut">Share your code. Friends who join with it are counted here, and referrals will count toward Premium perks.</p><p style="font-size:26px;font-weight:700;letter-spacing:.1em;margin:6px 0">${E(D.ref||'—')}</p><input type="text" readonly value="${E(l)}" aria-label="My referral link"><div class="row" style="margin-top:12px"><button class="btn g" data-a="copy">Copy link</button><span class="mut">${E(V.cp)}</span></div><p class="mut">Friends joined with your code: ${D.refs}</p></div>
<div class="card"><span class="tag">Update my answers</span><p class="mut">Your answers can change anytime. Suggestions update with them.</p><div class="row"><button class="btn g" data-a="edit" data-v="ob">Edit getting-started answers</button><button class="btn g" data-a="edit" data-v="as">Edit assessment</button></div></div>
<div class="card"><span class="tag">Account</span><div class="row"><button class="btn g" data-a="out">Log out</button>${V.cd?'<button class="btn" data-a="del2">Yes, permanently delete my account</button><button class="btn g" data-a="del0">Keep it</button>':'<button class="btn g" data-a="del1">Delete account</button>'}</div></div>`}};

let lk='';
let WEL=true;
const fd=n=>n.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long',year:'numeric'}),ft=n=>n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
function tick(){const n=new Date(),a=document.getElementById('ct'),b=document.getElementById('cd');if(a)a.textContent=ft(n);if(b)b.textContent=fd(n)}
function welcome(){const g=!me,n=new Date(),nm=g?'':(D.pd.display_name||'Friend'),goal=g?'':(cp()?cp().n:(D.ob.reason||''));
return `<main class="wel enter"><div class="wc"><span class="brand" style="color:#fff">Kavelyr</span>
${g?'':`<div class="wav">${avH(104)}</div>`}
<p class="wsm">${g?'Welcome to Kavelyr':'Welcome back'}</p>
<h1 class="wh">${g?'Discover who you can become.':E(nm)}</h1>
${g?'':`<div class="wbox"><span class="wl">You are becoming</span><strong style="font-size:20px">${goal?E(goal):'Choose your path in Explore'}</strong></div>`}
<div class="wbox"><span class="wl" id="cd">${fd(n)}</span><strong id="ct" style="font-size:32px">${ft(n)}</strong></div>
${g?`<button class="wb" data-a="wlogin">Login</button><button class="wb o" data-a="wsign">Create new account</button>`:`<button class="wb" data-a="enterapp">Continue to my journey</button>`}
${V.ref&&g?`<p class="wsm" style="text-transform:none;letter-spacing:0">Referral code applied: ${E(V.ref)}</p>`:''}
${g?'':`<button class="wb o" style="font-size:15px;min-height:46px" data-a="out">Not you? Log out</button>`}
</div></main>`}
function render(){const k=WEL?'w':!me?'a'+V.mode:V.f?'f'+V.f+(V.f==='ob'?D.ostep:D.astep):'h'+V.tab,y=window.scrollY;if(me&&D&&!V.f&&!WEL)chkBadges();$('#app').innerHTML=WEL?welcome():!me?auth():V.f?flow():home();const nw=k!==lk;lk=k;if(nw){window.scrollTo(0,0);const m=$('#app main');if(m)m.classList.add('enter')}else window.scrollTo(0,y)}
async function enter(id){me=id;try{await load()}catch(x){me=null;D=null;throw x}touch();loadN();V={tab:'profile',f:!D.done.ob?'ob':!D.done.as?'as':null,edit:false,mode:'login',err:'',exp:false,cd:false,msg:'',ref:V.ref,cp:''}}
async function act(a,v){if(a==='menu'||a==='mclose'){document.querySelectorAll('#dr,#ov').forEach(e=>e.classList[a==='menu'?'toggle':'remove']('o'));return}
const f=V.f,L=f==='ob'?OB:AS,k=f==='ob'?'ostep':'astep';
switch(a){
case 'mode':V.mode=V.mode==='signup'?'login':V.mode==='forgot'?'login':'signup';V.err='';break;
case 'enterapp':WEL=false;break;
case 'wlogin':WEL=false;V.mode='login';V.err='';break;
case 'wsign':WEL=false;V.mode='signup';V.err='';break;
case 'wref':{V.ref=((($('#wrc')||{}).value)||'').trim().toUpperCase();WEL=false;V.mode='signup';V.err='';break}
case 'rate':{const c=ckNow();c.r=c.r===+v?0:+v;break}
case 'sum':break;
case 'inst':{if(dip){dip.prompt();try{await dip.userChoice}catch(x){}dip=null}break}
case 'pnot':ls('kv_pp',String(Date.now()+14*864e5));break;
case 'pnever':ls('kv_pp',String(Date.now()+3650*864e5));break;
case 'forgot':V.mode='forgot';V.err='';break;
case 'copy':{try{await navigator.clipboard.writeText(refLink());V.cp='Copied!'}catch(x){V.cp='Press and hold the link to copy it.'}break}
case 'opt':{const d=L[D[k]],s=f==='ob'?D.ob:D.a;if(d.t==='multi'){const r=s[d.k]=s[d.k]||[],i=r.indexOf(v);if(i>-1)r.splice(i,1);else if(!d.max||r.length<d.max)r.push(v)}else s[d.k]=s[d.k]===v?'':v;break}
case 'back':D[k]--;break;
case 'next':if(D[k]<L.length-1)D[k]++;else{D.done[f]=true;D[k]=0;if(f==='ob'&&!D.done.as&&!V.edit)V.f='as';else{V.f=null;V.edit=false;V.tab='profile'}}break;
case 'exit':V.f=null;V.edit=false;break;
case 'tab':V.tab=v;if(v==='alerts'){NT.forEach(n=>{n.r=1});svN()}break;
case 'more':V.more=!V.more;break;
case 'dis':D.dis.push(v);break;
case 'undis':D.dis=[];break;
case 'pick':{const c=C.find(x=>x.n===v);let p=D.plans.find(x=>x.n===c.n);if(!p){p={id:uid(),n:c.n,plan:[{t:'Talk to someone working in '+c.n+' for 15 minutes (days 1–5)'},{t:c.x+' (days 3–10)'},{t:'Write down what energised you and what drained you (days 11–14)'}]};D.plans.push(p)}D.cur=p.id;V.tab='plan';break}
case 'addskill':{const x=$('#sk').value.trim();if(!x)break;let p=D.plans.find(q=>q.n.toLowerCase()===x.toLowerCase());if(!p){p={id:uid(),n:x,plan:[{t:'Talk to someone who uses '+x+' for 15 minutes (days 1–5)'},{t:'Try one beginner exercise or tutorial in '+x+' (days 3–10)'},{t:'Write down what energised you and what drained you (days 11–14)'}]};D.plans.push(p)}D.cur=p.id;V.tab='plan';break}
case 'sw':D.cur=v;V.rm='';break;
case 'rm1':V.rm=D.cur;break;
case 'rmno':V.rm='';break;
case 'rmgo':D.plans=D.plans.filter(p=>p.id!==D.cur);D.cur=D.plans[0]?D.plans[0].id:'';V.rm='';break;
case 'tog':cp().plan[+v].done=!cp().plan[+v].done;break;
case 'addt':{const x=$('#newt').value.trim();if(x)cp().plan.push({t:x});break}
case 'savej':{const x=$('#j').value.trim();if(x)D.journal.unshift({d:new Date().toLocaleDateString(),t:x});break}
case 'delj':D.journal.splice(+v,1);break;
case 'edit':V.f=v;V.edit=true;D[v==='ob'?'ostep':'astep']=0;break;
case 'export':V.exp=!V.exp;break;
case 'del1':V.cd=true;break;
case 'del0':V.cd=false;break;
case 'out':{await sync();await SB.auth.signOut();me=null;D=null;WEL=true;V.mode='login';break}
case 'del2':{try{const r=await SB.rpc('delete_my_account');if(r.error)throw r.error;await SB.auth.signOut();me=null;D=null;WEL=true;V.cd=false;V.mode='signup'}catch(x){V.msg='Could not delete your account. Try again.'}break}}
if(!['tab','mode','forgot','copy','export','del0','del1','rm1','rmno','sw'].includes(a))save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b){ls('kv_seen',String(Date.now()));act(b.dataset.a,b.dataset.v)}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.av&&el.files&&el.files[0]&&D){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);D.pd.avatar=c.toDataURL('image/jpeg',.8);save();render()};im.src=r.result};r.readAsDataURL(el.files[0])}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.ob&&D){D.ob[el.dataset.ob]=el.value;save()}
if(el.dataset&&el.dataset.ck&&D){ckNow()[el.dataset.ck]=el.value;save()}
if(el.dataset&&el.dataset.pf&&D){D.pd[el.dataset.pf]=el.value;save()}
if(el.dataset&&el.dataset.key&&V.f&&D){(V.f==='ob'?D.ob:D.a)[el.dataset.key]=el.value;save()}});
document.addEventListener('submit',async e=>{e.preventDefault();const g=i=>$(i)?$(i).value.trim():'',em=g('#em').toLowerCase(),pw=$('#pw')?$('#pw').value:'',m=V.mode;V.err='';
if(m!=='reset'&&!/^\S+@\S+\.\S+$/.test(em)){V.err='Enter a valid email address.';return render()}
if((m==='signup'||m==='reset')&&pw.length<8){V.err='Use at least 8 characters.';return render()}
if(m==='signup')V.ref=g('#rc').toUpperCase();
e.target.querySelector('button').disabled=true;
try{
if(m==='forgot'){await SB.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});V.err='If an account exists for that email, a reset link is on its way. Check your inbox.';V.mode='login'}
else if(m==='reset'){const r=await SB.auth.updateUser({password:pw});if(r.error)throw r.error;history.replaceState(null,'',location.pathname);await enter(r.data.user.id)}
else if(m==='signup'){const r=await SB.auth.signUp({email:em,password:pw,options:{data:{ref:V.ref}}});if(r.error)throw r.error;if(!r.data.session){V.err='Check your email to confirm your account, then log in.';V.mode='login';return render()}await enter(r.data.session.user.id)}
else{const r=await SB.auth.signInWithPassword({email:em,password:pw});if(r.error)throw r.error;await enter(r.data.user.id)}}
catch(x){V.err=x.message||'Something went wrong. Try again.'}
render()});
(async function(){$('#app').innerHTML='<main class="w"><p class="mut">Loading…</p></main>';V.ref=(new URLSearchParams(location.search).get('ref')||'').toUpperCase();
if(REC){WEL=false;V.mode='reset';render();return}
const r=await SB.auth.getSession(),ss=r.data.session;if(ss){try{await enter(ss.user.id)}catch(x){V.err='Could not load your data. Log in again.'}}render();setInterval(tick,1000);setInterval(()=>{if(me&&D)remind()},36e5)})();
</script></body></html>
