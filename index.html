.warm{background:var(--warm);color:var(--wink);border-radius:12px;padding:12px 14px;margin:10px 0}
.task{display:flex;gap:12px;align-items:center;min-height:44px;font-weight:400;margin:4px 0}

const wk=(d)=>{const x=new Date(d||new Date());x.setDate(x.getDate()-((x.getDay()+6)%7));return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};

${P.map((p,i)=>`<label class="task"><input type="checkbox" data-a="tog" data-v="${i}" ${p.done?'checked':''}>${E(p.t)}</label>`).join('')}
<label for="newt">Add your own action</label><div class="row"><input id="newt" type="text" style="flex:1;min-width:180px"><button class="btn g" data-a="addt">Add</button></div>
<div class="row" style="margin-top:16px">${V.rm===c.id?'<button class="btn" data-a="rmgo">Yes, remove this skill</button><button class="btn g" data-a="rmno">Keep it</button>':'<button class="btn g" data-a="rm1">Remove this skill</button>'}</div></div>
${d===t&&t?'<div class="warm">Nice work. Write what you learned in your Journal, then adjust or add another skill.</div><div class="row"><button class="btn" data-a="tab" data-v="journal">Write a reflection</button><button class="btn g" data-a="tab" data-v="explore">Add another skill</button></div>':''}`},
checkin(){const c=D.cks.find(x=>x.w===wk())||{e:'',d:'',r:0,n:''},prev=D.cks.find(x=>x.w!==wk()),n=streak(),cu=cp(),nt=cu&&cu.plan.find(p=>!p.done);let shift='';
if(c.e||c.d||c.r){const used=[c.e&&'what energised you',c.d&&'what drained you',c.r&&'your progress rating'].filter(Boolean),
ch=c.r&&prev&&prev.r?(c.r>prev.r?`Your progress rating rose from ${prev.r} to ${c.r}.`:c.r<prev.r?`Your progress rating moved from ${prev.r} to ${c.r}.`:`Your progress rating held at ${c.r}.`):'',

shift=`<div class="card"><span class="tag">Here's what shifted · suggested</span>${ch?`<p>${ch}</p>`:''}${c.e?`<p>Energised: ${E(c.e)}</p>`:''}${c.d?`<p>Drained: ${E(c.d)}</p>`:''}<p>${E(step)}</p><p class="mut">Based on: ${E(used.join(', '))}.</p></div>`}

${D.cks.filter(x=>x.w!==wk()).slice(0,4).map(x=>`<div class="card"><span class="tag">Week of ${E(x.w)}</span><p class="mut">Energised: ${E(x.e||'—')}<br>Drained: ${E(x.d||'—')}<br>Progress: ${x.r||'—'}/5</p></div>`).join('')}`},

<div class="card"><span class="tag">Profile details</span><label for="dn">Display name</label><input id="dn" type="text" data-pf="display_name" value="${E(D.pd.display_name)}"><label for="co">Country</label><input id="co" type="text" data-pf="country" value="${E(D.pd.country)}"><label for="bi">About me (optional)</label><textarea id="bi" rows="3" data-pf="bio">${E(D.pd.bio)}</textarea><p class="mut">Saved automatically. Shown only to you.</p></div>

function render(){$('#app').innerHTML=!me?auth():V.f?flow():home();window.scrollTo(0,0)}
async function enter(id){me=id;try{await load()}catch(x){me=null;D=null;throw x}V={tab:'profile',f:!D.done.ob?'ob':!D.done.as?'as':null,edit:false,mode:'login',err:'',exp:false,cd:false,msg:'',ref:V.ref,cp:''}}
async function act(a,v){const f=V.f,L=f==='ob'?OB:AS,k=f==='ob'?'ostep':'astep';
switch(a){
case 'mode':V.mode=V.mode==='signup'?'login':V.mode==='forgot'?'login':'signup';V.err='';break;
case 'aisug':{const d=L[D[k]];if(!V.aiq){V.ai={err:'Describe what you enjoy first.'};break}V.ai={busy:true};render();try{const r=await ai({mode:'suggest',field:d.k,options:d.o,selected:D.a[d.k]||[],text:V.aiq});V.ai={key:d.k,picks:r.picks||[],why:r.why||'',left:r.left}}catch(x){V.ai={err:x.message}}break}
case 'aiadd':{const d=L[D[k]],r=D.a[d.k]=D.a[d.k]||[];if(!r.includes(v)&&(!d.max||r.length<d.max))r.push(v);break}
case 'aiov':{const c=cp();V.ov='Thinking…';render();try{const r=await ai({mode:'overview',skill:c.n});c.o={w:r.what,s:r.skills,t:r.start};V.ov=''}catch(x){V.ov=x.message}break}
case 'aiexp':{V.ex=V.ex||{};V.ex[v]='Thinking…';render();try{const r=await ai({mode:'explain',direction:v,profile:{interests:D.a.interests||[],strengths:D.a.shown||[],values:D.a.values||[]}});V.ex[v]=r.text}catch(x){V.ex[v]=x.message}break}
case 'rate':{const c=ckNow();c.r=c.r===+v?0:+v;break}
case 'sum':break;
case 'inst':{if(dip){dip.prompt();try{await dip.userChoice}catch(x){}dip=null}break}
case 'pnot':ls('kv_pp',String(Date.now()+14*864e5));break;
case 'pnever':ls('kv_pp',String(Date.now()+3650*864e5));break;
case 'forgot':V.mode='forgot';V.err='';break;
case 'copy':{try{await navigator.clipboard.writeText(refLink());V.cp='Copied!'}catch(x){V.cp='Press and hold the link to copy it.'}break}
case 'opt':{const d=L[D[k]],s=f==='ob'?D.ob:D.a;if(d.t==='multi'){const r=s[d.k]=s[d.k]||[],i=r.indexOf(v);if(i>-1)r.splice(i,1);else if(!d.max||r.length<d.max)r.push(v)}else s[d.k]=s[d.k]===v?'':v;break}
case 'back':D[k]--;break;
case 'next':if(D[k]<L.length-1)D[k]++;else{D.done[f]=true;D[k]=0;if(f==='ob'&&!D.done.as&&!V.edit)V.f='as';else{V.f=null;V.edit=false;V.tab='profile'}}break;
case 'exit':V.f=null;V.edit=false;break;
case 'tab':V.tab=v;V.exp=false;break;
case 'dis':D.dis.push(v);break;
case 'undis':D.dis=[];break;
case 'pick':{const c=C.find(x=>x.n===v);let p=D.plans.find(x=>x.n===c.n);if(!p){p={id:uid(),n:c.n,plan:[{t:'Talk to someone working in '+c.n+' for 15 minutes (days 1–5)'},{t:c.x+' (days 3–10)'},{t:'Write down what energised you and what drained you (days 11–14)'}]};D.plans.push(p)}D.cur=p.id;V.tab='plan';break}
case 'addskill':{const x=$('#sk').value.trim();if(!x)break;let p=D.plans.find(q=>q.n.toLowerCase()===x.toLowerCase());if(!p){p={id:uid(),n:x,plan:[{t:'Talk to someone who uses '+x+' for 15 minutes (days 1–5)'},{t:'Try one beginner exercise or tutorial in '+x+' (days 3–10)'},{t:'Write down what energised you and what drained you (days 11–14)'}]};D.plans.push(p)}D.cur=p.id;V.tab='plan';break}
case 'sw':D.cur=v;V.rm='';break;
case 'rm1':V.rm=D.cur;break;
case 'rmno':V.rm='';break;
case 'rmgo':D.plans=D.plans.filter(p=>p.id!==D.cur);D.cur=D.plans[0]?D.plans[0].id:'';V.rm='';break;
case 'tog':cp().plan[+v].done=!cp().plan[+v].done;break;
case 'addt':{const x=$('#newt').value.trim();if(x)cp().plan.push({t:x});break}
case 'savej':{const x=$('#j').value.trim();if(x)D.journal.unshift({d:new Date().toLocaleDateString(),t:x});break}
case 'delj':D.journal.splice(+v,1);break;
case 'edit':V.f=v;V.edit=true;D[v==='ob'?'ostep':'astep']=0;break;
case 'export':V.exp=!V.exp;break;
case 'del1':V.cd=true;break;
case 'del0':V.cd=false;break;
case 'out':{await sync();await SB.auth.signOut();me=null;D=null;V.mode='login';break}
case 'del2':{try{const r=await SB.rpc('delete_my_account');if(r.error)throw r.error;await SB.auth.signOut();me=null;D=null;V.cd=false;V.mode='signup'}catch(x){V.msg='Could not delete your account. Try again.'}break}}
if(!['tab','mode','forgot','copy','export','del0','del1','rm1','rmno','sw'].includes(a))save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v)});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.aiq){V.aiq=el.value;return}
if(el.dataset&&el.dataset.ck&&D){ckNow()[el.dataset.ck]=el.value;save()}
if(el.dataset&&el.dataset.pf&&D){D.pd[el.dataset.pf]=el.value;save()}

document.addEventListener('submit',async e=>{e.preventDefault();const g=i=>$(i)?$(i).value.trim():'',em=g('#em').toLowerCase(),pw=$('#pw')?$('#pw').value:'',m=V.mode;V.err='';

if((m==='signup'||m==='reset')&&pw.length<8){V.err='Use at least 8 characters.';return render()}
if(m==='signup')V.ref=g('#rc').toUpperCase();
e.target.querySelector('button').disabled=true;
try{
if(m==='forgot'){await SB.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});V.err='If an account exists for that email, a reset link is on its way. Check your inbox.';V.mode='login'}
else if(m==='reset'){const r=await SB.auth.updateUser({password:pw});if(r.error)throw r.error;history.replaceState(null,'',location.pathname);await enter(r.data.user.id)}
else if(m==='signup'){const r=await SB.auth.signUp({email:em,password:pw,options:{data:{ref:V.ref}}});if(r.error)throw r.error;if(!r.data.session){V.err='Check your email to confirm your account, then log in.';V.mode='login';return render()}await enter(r.data.session.user.id)}
else{const r=await SB.auth.signInWithPassword({email:em,password:pw});if(r.error)throw r.error;await enter(r.data.user.id)}}
catch(x){V.err=x.message||'Something went wrong. Try again.'}
render()});
(async function(){$('#app').innerHTML='<main class="w"><p class="mut">Loading…</p></main>';V.ref=(new URLSearchParams(location.search).get('ref')||'').toUpperCase();
if(REC){V.mode='reset';render();return}
const r=await SB.auth.getSession(),ss=r.data.session;if(ss){try{await enter(ss.user.id)}catch(x){V.err='Could not load your data. Log in again.'}}render()})();
